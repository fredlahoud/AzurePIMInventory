name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          foreach ($r in $results) {
            $file  = [System.IO.Path]::GetRelativePath($PWD, $r.ScriptPath)
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host "::$level file=$file,line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          if ($results.Count -gt 0) { throw "$($results.Count) PSScriptAnalyzer finding(s)." }
          Write-Host 'No PSScriptAnalyzer findings.'

  test:
    name: Pester (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell   # Windows PowerShell 5.1
          - os: windows-latest
            shell: pwsh         # PowerShell 7
          - os: ubuntu-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 5
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'TestResults/pester-${{ matrix.os }}-${{ matrix.shell }}.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: TestResults/
          if-no-files-found: ignore

  sample-report:
    name: Build sample report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Generate offline report from sample data
        shell: pwsh
        run: |
          ./Export-AzPimAssignmentInventory.ps1 -OfflineSampleData ./sample-data.json `
            -OutputPath ./report -ReferenceDateUtc '2026-09-11 01:36'

      - name: Upload sample report
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: report/
